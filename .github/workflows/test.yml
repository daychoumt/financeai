name: Testes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm ci --prefix functions --ignore-scripts
      - run: node -e "if (typeof require('./functions').financeChat !== 'function') process.exit(1)"
